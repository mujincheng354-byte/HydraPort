[package]
name = "port-manager"
version = "0.1.0"
edition = "2021"
description = "轻量 Windows 端口管理工具"

# 界面层为纯 Win32 控件（开发文档 §2 的备选 GUI 方案）。
# 之所以不用 egui + eframe：它的 OpenGL 后端会把显卡驱动整块拉进进程，
# 一个空白 eframe 窗口的专用工作集就有 30.1 MB，已经顶满 §1.3 的 30 MB 目标；
# 原生控件不创建 OpenGL 上下文，同规模界面只要 1.7 MB。详见 README「实测指标」。
[dependencies]
anyhow = "1.0"
chrono = "0.4"
csv = "1.3"
# set_boxed_logger 在 std 特性下；默认特性只给 no_std 的 set_logger
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
# 只保留进程与系统信息：默认特性还会带上 WMI/COM、磁盘枚举、网络枚举以及 rayon 线程池，
# 本程序全都用不到，却会实打实地增加内存占用与二进制体积。
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # WNDCLASSW、字体与绘制相关结构体在 windows-sys 里被放在 Gdi 特性下
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # 剪贴板（OpenClipboard 一族）
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    # 列表视图、状态栏、InitCommonControlsEx、SetWindowTheme
    "Win32_UI_Controls",
    # 导出 CSV 用的系统「另存为」对话框
    "Win32_UI_Controls_Dialogs",
    # GetDpiForWindow / AdjustWindowRectExForDpi
    "Win32_UI_HiDpi",
    # EnableWindow / SetFocus / VK_F5：windows-sys 把它们放在输入设备模块下
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
